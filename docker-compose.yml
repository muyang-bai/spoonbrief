services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: hotmailbrief:latest
    restart: unless-stopped
    env_file: .env
    environment:
      USE_SQLITE: "false"
      ENABLE_LOCAL_SCHEDULER: "false"
      REDIS_HOST: redis
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/app/data
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 8s
      retries: 5
      start_period: 20s

  celery-worker:
    image: hotmailbrief:latest
    restart: unless-stopped
    env_file: .env
    environment:
      USE_SQLITE: "false"
      ENABLE_LOCAL_SCHEDULER: "false"
      REDIS_HOST: redis
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: celery -A app.tasks.celery_app.celery_app worker --loglevel=info --concurrency=2
    depends_on:
      redis:
        condition: service_healthy

  celery-beat:
    image: hotmailbrief:latest
    restart: unless-stopped
    env_file: .env
    environment:
      USE_SQLITE: "false"
      ENABLE_LOCAL_SCHEDULER: "false"
      REDIS_HOST: redis
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: celery -A app.tasks.celery_app.celery_app beat --loglevel=info --schedule /var/lib/celery/beat-schedule
    volumes:
      - beatdata:/var/lib/celery
    depends_on:
      redis:
        condition: service_healthy

  frontend:
    image: hotmailbrief:latest
    restart: unless-stopped
    environment:
      FRONTEND_PORT: "8080"
      FRONTEND_HOST: "0.0.0.0"
      FRONTEND_DIR: /app/frontend/dist
      BACKEND_URL: http://backend:8000
    command: python /app/serve_frontend.py
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 8s
      retries: 5
      start_period: 10s

volumes:
  redisdata:
  beatdata:
